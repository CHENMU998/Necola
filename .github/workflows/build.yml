name: Build Necola

on:
  push:
    branches: [ main, master, fix ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ~/AppData/Local/vcpkg
          ~/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('xmake.lua') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
          
    - name: Configure xmake
      run: xmake f -m release -a x86 -y
      
    - name: Build project
      run: xmake -y -v
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: necola-build-x86
        path: |
          build/windows/x86/release/necola.dll
          build/windows/x86/release/left4dead2_necola.exe
          kpatch.ini
          
    - name: Create Release
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/windows/x86/release/necola.dll
          build/windows/x86/release/left4dead2_necola.exe
          kpatch.ini
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
