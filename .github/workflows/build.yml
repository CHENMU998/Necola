name: Build Necola

on:
  push:
    branches: [ main, master, fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure and Build
      run: |
        xmake f -m release -a x86 -y -v
        xmake -y -v

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: necola-build-x86
        path: |
          build/windows/x86/release/necola.dll
          build/windows/x86/release/left4dead2_necola.exe
          kpatch.ini
