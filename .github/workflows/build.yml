name: Build Necola

on:
  push:
    branches: [ main, master, fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install vcpkg (classic mode)
      run: |
        $vcpkgDir = "C:\vcpkg"
        git clone --depth=1 https://github.com/microsoft/vcpkg.git "$vcpkgDir"
        cd "$vcpkgDir"
        .\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV
        echo "VCPKG_INSTALLATION_ROOT=$vcpkgDir" >> $env:GITHUB_ENV

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-x86-${{ hashFiles('xmake.lua') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-x86-

    - name: Configure xmake
      run: |
        xmake f -m release -a x86 -y -v
      env:
        VCPKG_ROOT: C:\vcpkg

    - name: Build project
      run: |
        xmake -y -v
      env:
        VCPKG_ROOT: C:\vcpkg

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: necola-build-x86
        path: |
          build/windows/x86/release/necola.dll
          build/windows/x86/release/left4dead2_necola.exe
          kpatch.ini
